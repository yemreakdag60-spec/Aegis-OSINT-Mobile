name: Build Aegis OSINT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Test and Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Aegis source
        id: extract
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'Aegis-OSINT-Mobile-v1.0.0-Source.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "Aegis source ZIP not found."
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR="$(find extracted -mindepth 1 -maxdepth 1 -type d -name 'Aegis-OSINT-Mobile-v1.0.0' -print -quit)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project directory not found."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Generate Gradle wrapper
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew

      - name: Run tests
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          ./gradlew --no-daemon testDebugUnitTest

      - name: Run Android Lint
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          ./gradlew --no-daemon lintDebug

      - name: Build Debug APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aegis-OSINT-Mobile-v1.0.0-APK
          path: ${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
